version: 2
registries:
  # auth for the private ALERTua/script submodule; the token lives in
  # Settings -> Secrets and variables -> Dependabot (NOT Actions)
  github-alertua:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{ secrets.SCRIPT_SUBMODULE_TOKEN }}
updates:
  - package-ecosystem: github-actions
    directory: "/"
    registries: "*"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gitsubmodule
    directory: "/"
    registries: "*"
    schedule:
      interval: "weekly"
